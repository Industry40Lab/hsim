{% extends "layout.html" %}

{% block title %}Gantt Chart{% endblock %}
{% block header %}Gantt Chart{% endblock %}

{% block content %}
<style>
    .gantt-iframe-container {
        height: 80vh;
        min-height: 600px;
        width: 100%;
        display: flex;
        flex-direction: column;
    }
    .gantt-iframe {
        flex: 1 1 auto;
        width: 100%;
        height: 100%;
        border: none;
        min-height: 600px;
    }
    .gantt-download-btn {
        margin-bottom: 1rem;
    }
</style>
<div class="card">
    <div class="card-header">
        <h5>Simulation Gantt Chart</h5>
    </div>
    <div class="card-body gantt-iframe-container">
        {% if gantt_file %}
            <a href="{{ url_for('main.gantt_file') }}" class="btn btn-primary gantt-download-btn" download="gantt_chart.html">
                Download Gantt Chart
            </a>
            <iframe src="{{ url_for('main.gantt_file') }}" class="gantt-iframe"></iframe>
        {% else %}
            <div class="alert alert-info">No Gantt chart available.</div>
        {% endif %}
    </div>
</div>
{% endblock %}
